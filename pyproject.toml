[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dynamic-subgoal-decomposer"
version = "0.1.0"
description = "Hierarchical subgoal decomposition and dynamic replanning engine with precondition checking and checkpoint rollbacks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-dynamic-subgoal-decomposer = "agent_dynamic_subgoal_decomposer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dynamic_subgoal_decomposer*"]
